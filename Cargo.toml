[workspace]
resolver = "3"
members = [
    "crates/qcy-protocol",
    "crates/qcy-bluez",
    "crates/qcyctl",
    "crates/qcy-gui",
    "crates/qcy-tray",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
qcy-protocol = { path = "crates/qcy-protocol" }
qcy-bluez = { path = "crates/qcy-bluez" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
futures-util = "0.3"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
strip = true
