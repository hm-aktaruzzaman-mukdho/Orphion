[package]
name = "qcy-gui"
description = "Desktop control panel for QCY earbuds"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "qcy-gui"
path = "src/main.rs"

[dependencies]
qcy-protocol.workspace = true
qcy-client.workspace = true
anyhow.workspace = true
eframe.workspace = true
egui_material_icons = { version = "0.8", default-features = false, features = ["filled", "outline"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
