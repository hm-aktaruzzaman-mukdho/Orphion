[package]
name = "orphion"
description = "Orphion: desktop control panel for QCY earbuds"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "orphion"
path = "src/main.rs"

[dependencies]
qcy-protocol.workspace = true
qcy-client.workspace = true
anyhow.workspace = true
eframe.workspace = true
material-colors = "0.5"
egui_material_icons = { version = "0.8", default-features = false, features = ["filled", "outline"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# GNOME (and other compositors without server-side decorations) need the
# window to draw its own title bar; eframe disables winit's default for it.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[build-dependencies]
embed-resource = "3"
