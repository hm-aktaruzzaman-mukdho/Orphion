[package]
name = "orphion"
description = "Orphion: control panel and tray icon for QCY earbuds"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "orphion"
path = "src/main.rs"

[dependencies]
qcy-protocol.workspace = true
qcy-client.workspace = true
anyhow.workspace = true
eframe.workspace = true
material-colors = "0.5"
egui_material_icons = { version = "0.8", default-features = false, features = ["filled", "outline"] }
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# GNOME (and other compositors without server-side decorations) need the
# window to draw its own title bar; eframe disables winit's default for it.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }
# Tray mode: KDE / StatusNotifierItem.
ksni.workspace = true

# Single-instance locks (flock).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Tray mode: notification-area icon and its message loop; single-instance
# mutexes and bringing an open window to the front.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
