[package]
name = "orphion-tray"
description = "Orphion: system tray applet for QCY earbuds (KDE/StatusNotifierItem on Linux, notification area on Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
qcy-protocol.workspace = true
qcy-client.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
